# Darmowy serwer gry na Render.com. Instrukcja: README, sekcja „Gra przez internet”.
services:
  - type: web
    name: teleturniej
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python -m server --cloud
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
